name: Build Treino da Bine v6

on:
  push:
    branches:
      - chatgpt/treino-bine-v6-rotinas-evolucao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: treino-bine-v4

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Baixar bancos de mídias autorizados
        run: |
          mkdir -p .cache
          git clone --depth 1 https://github.com/yuhonas/free-exercise-db.git .cache/free-exercise-db
          git clone --depth 1 https://github.com/arhxam/free-exercise-db-with-videos.git .cache/free-exercise-db-with-videos

      - name: Gerar versão v6 e incorporar mídias
        run: |
          python3 scripts/apply_v5.py
          python3 scripts/patch_v5.py
          python3 scripts/apply_v6.py
          python3 scripts/download_media.py
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/media-map.js
          grep -q "Rotina do Dia" app/src/main/assets/index.html
          grep -q "Sua evolução" app/src/main/assets/index.html
          grep -q "durationSec" app/src/main/assets/index.html
          grep -q "pickMedia" app/src/main/java/br/com/treinodabine/MainActivity.java
          grep -q "exportBackup" app/src/main/java/br/com/treinodabine/MainActivity.java
          grep -q "versionCode 6" app/build.gradle

      - name: Compilar APK instalável
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validar assinatura e estrutura
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" Treino_da_Bine_v6_Rotinas_e_Evolucao.apk
          sha256sum Treino_da_Bine_v6_Rotinas_e_Evolucao.apk > SHA256.txt
          unzip -t Treino_da_Bine_v6_Rotinas_e_Evolucao.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Treino-da-Bine-v6-APK
          path: |
            treino-bine-v4/Treino_da_Bine_v6_Rotinas_e_Evolucao.apk
            treino-bine-v4/SHA256.txt
          if-no-files-found: error
          retention-days: 30
